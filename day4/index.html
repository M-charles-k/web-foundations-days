<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple note editor with a live character counter, word counter and dark mode.">
    <title>QuickNotes | Live Character Counter</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="header-content">
            <a class="brand" href="index.html">QuickNotes</a>
            <button id="theme-toggle" type="button">Dark mode</button>
        </div>
    </header>


<main class="container">
    <section class="editor-card" aria-labelledby="page-title">
        <p class="eyebrow">YOUR WRITING SPACE</p>
        <h1 id="page-title">Capture your thoughts.</h1>
        <p class="intro">Write freely. Keep an eye on your limits. Your draft saves automatically.</p>

        <label for="note-text">Your note</label>
        <textarea
            id="note-text"
            rows="10"
            maxlength="200"
            placeholder="Start writing your note here..."
            aria-describedby="char-count word-count"
        ></textarea>

        <div class="counter-row" aria-live="polite">
            <p id="char-count">0 / 200 characters</p>
            <p id="word-count">0 words</p>
        </div>

        <div class="editor-footer">
            <span class="save-status">Draft saved in this browser</span>
            <button id="clear-btn" type="button" class="clear-button">Clear note</button>
        </div>
    </section>

    <p class="page-note">Your draft stays in this browser using localStorage.</p>
</main>

<footer class="site-footer">
    <p>QuickNotes · A little space for your ideas.</p>
</footer>

</body>
</html>
