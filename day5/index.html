
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Directory | Day 5</title>
    <script src="users.js" defer></script>
</head>
<body>
    <header>
        <h1>User Directory</h1>
        <p>Load and explore users from an online API.</p>
    </header>

    <main>
        
<section aria-labelledby="add-user-heading">
    <h2 id="add-user-heading">Add a New User</h2>

    <form id="add-user-form">
        <p>
            <label for="user-name">Full name:</label>
            <input type="text" id="user-name" required>
        </p>

        <p>
            <label for="user-email">Email:</label>
            <input type="email" id="user-email" required>
        </p>

        <p>
            <label for="user-city">City:</label>
            <input type="text" id="user-city" required>
        </p>

        <p>
            <label for="user-company">Company:</label>
            <input type="text" id="user-company" required>
        </p>

        <button type="submit">Add User</button>
    </form>
</section>

  <section aria-labelledby="directory-heading">
            <h2 id="directory-heading">Explore Users</h2>

            <button id="load-users" type="button">Load Users</button>

            <p>
                <label for="filter-input">Filter users by name:</label>
                <input
                    type="text"
                    id="filter-input"
                    placeholder="Enter a name..."
                >
            </p>

            <p id="status" role="status" aria-live="polite">
                Click "Load Users" to begin.
            </p>

            <ul id="users-list"></ul>
        </section>

    </main>

    <footer>
        <p>Web Foundations | Day 5 Assignment</p>
    </footer>
</body>
</html>
